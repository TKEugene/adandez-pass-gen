apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adandez-pass-gen
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
# CI rewrites newName/newTag on every deploy. Keep these two lines in this exact format.
images:
  - name: adandez-pass-gen
    newName: tkeugene/adandez-pass-gen
    newTag: latest