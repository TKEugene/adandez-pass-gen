apiVersion: apps/v1
kind: Deployment
metadata:
  name: adandez-pass-gen
  labels:
    app.kubernetes.io/name: adandez-pass-gen
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: adandez-pass-gen
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below 2 healthy pods during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adandez-pass-gen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: adandez-pass-gen
      containers:
        - name: web
          # Name and tag are rewritten by kustomization.yaml (CI sets the exact tag on every deploy).
          image: adandez-pass-gen
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp      # nginx pid file and temp dirs (root filesystem is read-only)
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
