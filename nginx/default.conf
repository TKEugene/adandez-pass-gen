server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;          # redirects stay relative, so they work behind any host/proxy
    root /usr/share/nginx/html;

    # Security headers (declared once at server level; locations below add none of their own)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Kubernetes probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /random-pass-gen -> /random-pass-gen/
    location = /random-pass-gen {
        return 301 /random-pass-gen/;
    }

    location /random-pass-gen/ {
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;                 # Cache-Control: no-cache -> browsers revalidate, so new releases show immediately
        etag on;
    }

    location / {
        return 404;
    }
}
